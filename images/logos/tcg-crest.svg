<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 100" role="img" aria-label="TCG CREST">
  <defs>
    <linearGradient id="tcg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#005299"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="220" height="100" rx="6" fill="url(#tcg-grad)"/>
  <!-- Accent bar -->
  <rect x="0" y="0" width="5" height="100" rx="3" fill="#c9a84c"/>
  <!-- Geometric crest mark (stylised C) -->
  <path d="M38 28 A24 24 0 1 0 38 72 L38 64 A16 16 0 1 1 38 36Z" fill="#c9a84c"/>
  <!-- TCG text -->
  <text x="72" y="42" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="2">TCG</text>
  <!-- CREST text -->
  <text x="72" y="66" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#c9a84c" letter-spacing="3">CREST</text>
  <!-- Full name -->
  <text x="72" y="82" font-family="Arial,sans-serif" font-size="6.5" fill="rgba(255,255,255,0.55)" letter-spacing="0.5">Centre for Research &amp; Education in S&amp;T</text>
</svg>
