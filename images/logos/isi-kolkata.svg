<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="Indian Statistical Institute, Kolkata">
  <defs>
    <radialGradient id="isi-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c3a6e"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </radialGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="90" cy="90" r="88" fill="url(#isi-bg)"/>
  <circle cx="90" cy="90" r="88" fill="none" stroke="#c9a84c" stroke-width="3"/>
  <circle cx="90" cy="90" r="78" fill="none" stroke="#c9a84c" stroke-width="0.8" stroke-dasharray="4 3"/>
  <!-- Flame / torch motif (simplified) -->
  <path d="M90 36 C84 44,76 52,78 62 C80 72,86 70,90 76 C94 70,100 72,102 62 C104 52,96 44,90 36Z" fill="#c9a84c" opacity="0.9"/>
  <path d="M90 52 C87 57,84 61,85 66 C86 71,89 69,90 72 C91 69,94 71,95 66 C96 61,93 57,90 52Z" fill="#fff" opacity="0.6"/>
  <!-- ISI text -->
  <text x="90" y="116" text-anchor="middle" font-family="Georgia,serif" font-size="34" font-weight="bold" fill="#ffffff" letter-spacing="4">ISI</text>
  <!-- Subtitle -->
  <text x="90" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#c9a84c" letter-spacing="2.5" font-weight="500">KOLKATA</text>
  <!-- Bottom label -->
  <text x="90" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="rgba(255,255,255,0.55)" letter-spacing="1.2">INDIAN STATISTICAL INSTITUTE</text>
</svg>
